name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          SKIP_MCPB_TESTS: "true"

      - name: Worker type check
        run: pnpm --filter helpscout-mcp-worker type-check

      - name: Worker tests
        run: pnpm --filter helpscout-mcp-worker test

      - name: Worker deploy dry run
        run: pnpm --filter helpscout-mcp-worker exec wrangler deploy --dry-run

